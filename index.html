<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mani uzdevumi</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Mani uzdevumi</h1>

        <div class="input-group">
            <input
                type="text"
                id="task-input"
                placeholder="Jauns uzdevums..."
                autocomplete="off"
            >
            <button id="add-btn">Pievienot</button>
        </div>

        <div class="filters">
            <button data-filter="all" class="active">Visi</button>
            <button data-filter="active">Aktīvie</button>
            <button data-filter="done">Izpildītie</button>
        </div>

        <ul id="task-list"></ul>

        <p class="counter">
            Atlikuši <span id="counter">0</span> uzdevumi
        </p>
    </main>
</body>
</html>
